<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Générateur de Scénario Necromunda</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.png">

  <style>
    :root {
      --bg-color: #1a1a1a;
      --card-bg: #2a2a2a;
      --accent-color: #d9534f;
      --text-color: #f0f0f0;
      --border-color: #444;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent-color);
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
    }

    .controls {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 900px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      box-sizing: border-box;
      margin-bottom: 20px;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    label {
      margin-bottom: 5px;
      font-weight: bold;
    }

    select, button {
      padding: 10px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background-color: #333;
      color: white;
      font-size: 16px;
    }

    button {
      background-color: var(--accent-color);
      color: white;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 10px;
      width: 100%;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #c9302c;
    }

    .btn-secondary {
      background-color: #555;
    }

    .btn-secondary:hover {
      background-color: #666;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .result-container {
      display: none;
      width: 100%;
      max-width: 900px;
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      box-sizing: border-box;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .full-width {
      grid-column: span 2;
    }

    .section {
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .section h2 {
      margin-top: 0;
      color: var(--accent-color);
      font-size: 1.2rem;
      text-transform: uppercase;
    }

    .mission-block {
      margin-bottom: 15px;
    }

    .mission-block:last-child {
      margin-bottom: 0;
    }

    .mission-block h4 {
      margin: 0 0 5px 0;
      color: #ff9f43;
      font-size: 0.95rem;
      text-transform: uppercase;
    }

    .deploy-img {
      max-width: 100%;
      max-height: 400px;
      height: auto;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      display: block;
      margin: 10px auto;
    }

    @media (max-width: 768px) {
      body {
        padding: 10px;
      }
      .controls-grid, .results-grid, .action-buttons {
        grid-template-columns: 1fr;
      }
      .form-group.full-width, .full-width {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <h1 id="main-title">Générateur de Scénario Necromunda</h1>

  <div id="controls-block" class="controls">
    <div class="controls-grid">
      <div class="form-group">
        <label for="attacker-house">Maison du Joueur Attaquant :</label>
        <select id="attacker-house">
          <option value="general">Missions généralistes</option>
          <option value="escher">Maison Escher</option>
          <option value="goliath">Maison Goliath</option>
          <option value="orlock">Maison Orlock</option>
          <option value="delaque">Maison Delaque</option>
          <option value="vansaar">Maison Van Saar</option>
          <option value="cawdor">Maison Cawdor</option>
        </select>
      </div>

      <div class="form-group">
        <label for="defender-house">Maison du Joueur Défenseur :</label>
        <select id="defender-house">
          <option value="general">Missions généralistes</option>
          <option value="escher">Maison Escher</option>
          <option value="goliath">Maison Goliath</option>
          <option value="orlock">Maison Orlock</option>
          <option value="delaque">Maison Delaque</option>
          <option value="vansaar">Maison Van Saar</option>
          <option value="cawdor">Maison Cawdor</option>
        </select>
      </div>

      <div class="form-group full-width">
        <label for="territory-select">Territoire :</label>
        <select id="territory-select">
          <!-- Généré automatiquement -->
        </select>
      </div>
    </div>

    <button onclick="generateScenario()">Générer le Scénario</button>
  </div>

  <div id="results" class="result-container">
    <div class="action-buttons">
      <button class="btn-secondary" onclick="resetToMenu()">← Modifier les paramètres</button>
      <button onclick="generateScenario()">Relancer la génération 🎲</button>
    </div>

    <div class="results-grid">
      <div class="section full-width">
        <h2>Territoire</h2>
        <h3 id="territory-name"></h3>
        <p id="territory-desc"></p>
      </div>

      <div class="section full-width">
        <h2>Déploiement</h2>
        <img id="deploy-image" class="deploy-img" src="" alt="Déploiement">
      </div>

      <div class="section full-width">
        <h2>Mission Principale (Commune)</h2>
        <h3 id="main-name"></h3>
        <p id="main-desc"></p>
      </div>

      <div class="section">
        <h2>Mission(s) Secondaire(s) — Attaquant</h2>
        <div id="sec-att-container"></div>
      </div>

      <div class="section">
        <h2>Mission(s) Secondaire(s) — Défenseur</h2>
        <div id="sec-def-container"></div>
      </div>

      <div class="section full-width">
        <h2>Composition de Liste (Commune)</h2>
        <h3 id="list-name"></h3>
        <p id="list-desc"></p>
      </div>
    </div>
  </div>

  <script>
    const territories = [
      { id: "settlement", name: "Settlement", desc: "Aucun effet particulier au cours de la partie." },
      { id: "bullet_den", name: "Bullet den", desc: "Une fois par round, tous les gangs peuvent recharger une arme pour une action gratuite." },
      { id: "rogue_doc", name: "Rogue doc shop", desc: "Quand un guerrier offre son assistance pour un soin, lancer 2 dés de blessure supplémentaires au lieu d'un seul." },
      { id: "mess_shack", name: "Mess Shack", desc: "Tous les guerriers ont +1 en Ld." },
      { id: "drinking_hole", name: "Drinking hole", desc: "Aucune arme de tir ne peut être utilisée lors du premier round." },
      { id: "fence_hangout", name: "Fence hangout", desc: "Les gangs gagnent D3x10 crédits de plus s'ils réussissent leur side job." },
      { id: "bounty_den", name: "Bounty den", desc: "Chaque gang génère un deuxième side job." },
      { id: "generatorium", name: "Generatorium", desc: "Durant cette partie, la règle visibilité (X) n'a aucun effet." },
      { id: "corpse_farm", name: "Corpse farm", desc: "Les gangs gagnent 10 crédits pour chaque ennemi en état out of action." },
      { id: "tunnels", name: "Tunnels", desc: "Durant cette partie, appliquer la règle tunnel warfare." },
      { id: "tech_bazaar", name: "Tech bazaar", desc: "Durant cette partie, il est interdit d'utiliser une arme à gabarit ou explosion (3\"/5\")." },
      { id: "promethium_cache", name: "Promethium cache", desc: "Toutes les armes avec la règle flamme (X+) améliorent X de 1." },
      { id: "collapsed_dome", name: "Collapsed dome", desc: "Durant cette partie, tout test d'agilité dont le résultat est 1 entraîne une blessure sans sauvegarde." },
      { id: "bone_shrine", name: "Bone shrine", desc: "Le défenseur place un marqueur dans les 6\" du centre de la table. Les guerriers peuvent gagner de l'XP s'ils contrôlent ce marqueur comme si c'était un objectif." },
      { id: "mine_workings", name: "Mine workings", desc: "Durant cette partie, la règle visibilité (18\") s'applique." },
      { id: "gambling_den", name: "Gambling den", desc: "Une fois par partie, chaque joueur peut relancer un unique dé." },
      { id: "synth_still", name: "Synth still", desc: "Durant cette partie, toutes les armes avec le trait toxine (X+) voient leur AP augmenter de 1." },
      { id: "old_ruins", name: "Old ruins", desc: "Durant cette partie, tout guerrier à portée longue d'une arme de tir et qui n'est pas à couvert voit sa Sv augmenter de 1." },
      { id: "fighting_pit", name: "Fighting pit", desc: "Tout guerrier qui cause l'état sérieusement blessé ou out of action à un ennemi gagne 1 XP additionnel." }
    ];

    const deployments = [
      "scenario 1.png",
      "scenario 2.png",
      "scenario 3.png",
      "scenario 4.png",
      "scenario 5.png",
      "scenario 6.png"
    ];

    const mainMissions = [
      { name: "Roi de la ruche", desc: "Placer un objectif au centre du champ de bataille. Lors de la phase de fin de round, le joueur qui contrôle l'objectif marque 1 points. Le premier joueur à 3 points gagne la partie." },
      { name: "Guerre de territoire", desc: "A partir du round 3, si un seul joueur a des guerriers qui ne sont pas sérieusement blessés à 9\" du centre de la table à la phase de fin de round, il a gagné." },
      { name: "Combat dans les tunnels", desc: "Placer un objectif au centre de la table, puis jeter un dé, le gagnant place un objectif à plus de 6\" de tout autre objectif et es bords de table, puis le perdant fait de même.Lors de la phase de fin de round, un joueur qui contrôle 2 objectifs gagne 1 point de victoire. Le premier arrivé à 3 a gagné." },
      { name: "Leçon par l'exemple", desc: "Lors de la phase de fin de round, chaque joueur marque 1 point de victoire pour tout ennemi mis hors de combat à ce round, avec un bonus de +1 si l'ennemi est de type leader, champion ou brute, et un bonus de +1 si la mise hors de combat résulte d'un combat au corps à corps ou d'un coup de grâce. Le premier à 10 points gagne la partie." },
      { name: "Coutournez les", desc: "L'attaquant choisit un bord de table et place un objectif au centre de celui-ci mais éloigné de 6\" du bord. Le défenseur fait de même sur le bord opposé. Lors de la phase de la fin ed round, le joueur controlant les 2 objectifs marque 1 point de victoire. Le premier à 3 points gagne la partie." },
      { name: "Brulez les tous", desc: "En commençant par le défenseur, chaque joueur place un objectif dans la zone de déploiement adverse en alternant le placement jusqu'à ce que chaque joueur ait placé 3 objectifs. Les objectifs doivent être à plus de 6\" les uns des autres si possible. Lors de la phase de fin de round, si un gang controle un objectif dans la zone adverse, il marque 1 points et retire l'objectif. Le premier joueur à 2 points gagne, sauf si les deux joueurs ont 2 points chacun, auquel cas c'est une égalité." }
    ];

    const generalSecondaryMissions = [
      { name: "Recousez les", desc: "En faisant un coup de grâce, au lieu de faire un test de force le joueur peut mettre un signe sur un guerrier sérieusement blessé. Si cela est réalisé sur au moins un ennemi, le joueur remplit sa mission secondaire." },
      { name: "Le paquet", desc: "Au début de la bataille, après le déploiement, choisissez un de vos guerriers et lui mettre un marqueur représentant le paquet.Si lors de la phase de fin de round à partir du 3ème round, le guerrier est en contact avec le bord de déploiement adverse, ou le centre du champ de bataille si la zone de déploiement adverse n'a pas de bord de table, la mission est réussie." },
      { name: "Régler les comptes", desc: "Après que les 2 gangs se soient déployés, sélectionner aléatoirement un guerrier ennemi qui n'est pas le leader qui devient votre cible. Si lors de la phase de fin e round, cet ennemi esthors de combat ou a quitté pour n'importe quelle raison le champ de bataille, la mission est remplie." },
      { name: "Coup dévastateur", desc: "Si, lors de la phase de fin de round, au moins la moitié des guerriers adverses encore en jeu est engagée ou sérieusement blessée, la mission est réussie." },
      { name: "Semer le trouble", desc: "N'importe quel guerrier n'ayant pas le type bête peut faire l'action double graffiti tant qu'ils sont dans la zone de déploiement adverse ou dans les 6\" du centre du champ de bataille si votre adversaire n'a pas de zone de déploiement. Si au moins un guerrier a pu faire cette action au cours de la bataille, la mission secondaire est réussie." },
      { name: "Protéger le futur", desc: "Après le déploiement des deux gangs, Sélectionner aléatoirement un guerrier avec le type prospect. Si le gang ne contient aucun prospect, sélectionner un ganger aléatoirement à la place. Si le gang ne contient pas non plus de ganger, relancer le dé. Si le guerrier sélectionné est toujours sur le champ de bataille à la fin de la partie, la mission est réussie." }
    ];

    const houseSecondaryMissions = {
      general: generalSecondaryMissions,
      escher: generalSecondaryMissions,
      goliath: generalSecondaryMissions,
      orlock: generalSecondaryMissions,
      delaque: generalSecondaryMissions,
      vansaar: generalSecondaryMissions,
      cawdor: generalSecondaryMissions
    };

    const listCompositions = [
      { name: "Intensification de la bataille", desc: "Les deux gangs utilisent la méthode hybride (3+D3) pour déterminer leur gang de départ. Les deux gangs utilisent la règle renfort (5) avec D3 renforts qui arrivent à chaque round après le premier." },
      { name: "Donnez tout !", desc: "Les deux gangs utilisent la méthode personnalisée (10) pour sélectionner leur gang de départ" },
      { name: "Patrouille", desc: "Chaque gang utilise la méthode hybride (3+4) pour leur sélection de gang" },
      { name: "Attaque surprise !", desc: "L'attaquant utilise la méthode hybride (4+4) pour déterminer leur gang de départ. Le défenseur utilise la méthode personnalisée (3) pour déterminer leur gang de départ. Il utilise aussi la règle de renfort (7) avec D3 renforts qui rejoignent la bataille chaque round à partir du premier." },
      { name: "Force d'intervention", desc: "Les deux gangs utilisent la méthode personnalisée (5) pour déterminer leur gang de départ." },
      { name: "Force de reconnaissance", desc: "Les deux gangs utilisent la méthode hybride (D3+5) pour déterminer leur gang de départ." }
    ];

    function initTerritoriesMenu() {
      const select = document.getElementById('territory-select');
      select.innerHTML = '';
      territories.forEach(t => {
        const option = document.createElement('option');
        option.value = t.id;
        option.textContent = t.name;
        select.appendChild(option);
      });
    }

    function getRandomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    // Tirage de N missions uniques dans une liste donnée
    function getRandomMissions(array, count = 1) {
      const shuffled = [...array].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    }

    function renderMissions(containerId, missions) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      missions.forEach((m, idx) => {
        const block = document.createElement('div');
        block.className = 'mission-block';
        
        const titleHtml = missions.length > 1 ? `<h4>Mission ${idx + 1}</h4>` : '';
        block.innerHTML = `
          ${titleHtml}
          <h3 style="margin: 0 0 5px 0;">${m.name}</h3>
          <p style="margin: 0;">${m.desc}</p>
        `;
        container.appendChild(block);
      });
    }

    function generateScenario() {
      const attHouse = document.getElementById('attacker-house').value;
      const defHouse = document.getElementById('defender-house').value;
      const selectedTerritoryId = document.getElementById('territory-select').value;

      const selectedTerritory = territories.find(t => t.id === selectedTerritoryId);
      const countSecondary = (selectedTerritoryId === 'bounty_den') ? 2 : 1;

      const randomDeploy = getRandomItem(deployments);
      const randomMain = getRandomItem(mainMissions);
      const randomSecAtt = getRandomMissions(houseSecondaryMissions[attHouse], countSecondary);
      const randomSecDef = getRandomMissions(houseSecondaryMissions[defHouse], countSecondary);
      const randomList = getRandomItem(listCompositions);

      document.getElementById('territory-name').innerText = selectedTerritory.name;
      document.getElementById('territory-desc').innerText = selectedTerritory.desc;

      document.getElementById('deploy-image').src = randomDeploy;
      
      document.getElementById('main-name').innerText = randomMain.name;
      document.getElementById('main-desc').innerText = randomMain.desc;

      renderMissions('sec-att-container', randomSecAtt);
      renderMissions('sec-def-container', randomSecDef);

      document.getElementById('list-name').innerText = randomList.name;
      document.getElementById('list-desc').innerText = randomList.desc;

      document.getElementById('main-title').style.display = 'none';
      document.getElementById('controls-block').style.display = 'none';
      document.getElementById('results').style.display = 'block';

      window.scrollTo(0, 0);
    }

    function resetToMenu() {
      document.getElementById('main-title').style.display = 'block';
      document.getElementById('controls-block').style.display = 'block';
      document.getElementById('results').style.display = 'none';

      window.scrollTo(0, 0);
    }

    initTerritoriesMenu();
  </script>
</body>
</html>
